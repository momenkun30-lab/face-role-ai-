<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة التحكم | Face Role AI</title>
    <style>
        body { background: #0b0c10; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .admin-card { background: #1f2833; padding: 40px; border-radius: 20px; border: 2px solid #ffd700; width: 350px; text-align: center; }
        input[type="file"] { margin: 20px 0; }
        button { width: 100%; padding: 15px; background: #ffd700; border: none; font-weight: bold; cursor: pointer; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="admin-card">
        <h2>لوحة التحكم الإعلانية ⚙️</h2>
        <p>ارفع صورة الإعلان الجديد (ستظهر في أعلى الموقع)</p>
        <input type="file" id="ad-file">
        <button onclick="uploadAd()">تحديث الإعلان ونشره</button>
        <p><a href="/" style="color: gray; text-decoration: none; font-size: 12px;">العودة للموقع</a></p>
    </div>

    <script>
        async function uploadAd() {
            const file = document.getElementById('ad-file').files[0];
            if (!file) return alert("اختر صورة");
            const fd = new FormData();
            fd.append('adImage', file);
            await fetch('/api/upload-ad', { method: 'POST', body: fd });
            alert("تم التحديث بنجاح!");
            window.location.href = "/";
        }
    </script>
</body>
</html>
