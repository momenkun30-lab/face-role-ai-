<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>غرفة التحكم المركزية | Face Role AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #ffd700;
            --bg: #0b0c10;
            --card: #1f2833;
            --danger: #ff4d4d;
            --success: #2ecc71;
            --sidebar: #000000;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Cairo', sans-serif;
            display: flex;
            height: 100vh;
        }

        /* Sidebar القائمة الجانبية */
        .sidebar {
            width: 280px;
            background: var(--sidebar);
            border-left: 2px solid var(--gold);
            display: flex;
            flex-direction: column;
            padding: 30px 15px;
        }

        .sidebar h2 { 
            color: var(--gold); 
            text-align: center; 
            font-weight: 900; 
            margin-bottom: 30px; 
            border-bottom: 2px solid var(--gold); 
            padding-bottom: 10px; 
        }

        .status-box {
            background: #111;
            padding: 15px;
            border-radius: 10px;
            font-size: 0.8rem;
            margin-bottom: 20px;
        }

        .btn-view-site {
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            text-align: center;
            margin-top: auto;
        }

        /* Main Content المحتوى الرئيسي */
        .main { flex: 1; padding: 30px; overflow-y: auto; }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); 
            gap: 25px; 
        }

        .card {
            background: var(--card);
            padding: 25px;
            border-radius: 15px;
            border: 1px solid rgba(255, 215, 0, 0.1);
        }

        .card h3 { 
            color: var(--gold); 
            margin-bottom: 20px; 
            border-right: 4px solid var(--gold); 
            padding-right: 10px; 
        }

        /* Monitor المراقبة الحية */
        .live-monitor { 
            text-align: center; 
            background: rgba(46, 204, 113, 0.05); 
            border: 1px solid var(--success); 
        }
        .live-number { 
            font-size: 4rem; 
            font-weight: 900; 
            color: var(--success); 
            display: block; 
        }

        /* Forms المدخلات */
        label { display: block; margin-top: 15px; margin-bottom: 5px; font-size: 0.9rem; color: #aaa; }
        input {
            width: 100%; 
            padding: 12px; 
            background: #0b0c10; 
            border: 1px solid #444; 
            border-radius: 8px; 
            color: white;
            font-family: 'Cairo', sans-serif;
        }

        .btn {
            width: 100%; 
            padding: 12px; 
            border: none; 
            border-radius: 8px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: 0.3s; 
            margin-top: 15px;
            font-family: 'Cairo', sans-serif;
        }
        .btn-gold { background: var(--gold); color: black; }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }

        /* Ads List قائمة الإعلانات المرفوعة */
        .ad-item {
            background: #000; 
            padding: 15px; 
            border-radius: 10px; 
            margin-top: 10px;
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            border: 1px solid #333;
        }
        .ad-item img { width: 60px; height: 40px; object-fit: cover; border-radius: 5px; }
        .ad-info { flex: 1; margin-right: 15px; }
        .ad-info p { font-size: 0.8rem; color: #ccc; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>غرفة التحكم</h2>
        <div class="status-box">
            <p>🟢 حالة السيرفر: متصل</p>
            <p id="last-sync">تحديث: جاري المزامنة...</p>
        </div>
        <a href="/" target="_blank" class="btn-view-site">زيارة الموقع الرئيسي</a>
    </div>

    <div class="main">
        <div class="grid">
            
            <div class="card live-monitor">
                <h3>👥 المستخدمين الحقيقيين (الآن)</h3>
                <span id="real-users-count" class="live-number">0</span>
                <p style="color: #666;">عدد الأشخاص الفعليين داخل الموقع حالياً</p>
            </div>

            <div class="card">
                <h3>📅 إضافة إعلان مجدول</h3>
                <label>صورة الإعلان:</label>
                <input type="file" id="ad-file" accept="image/*">
                
                <div style="display: flex; gap: 10px;">
                    <div style="flex: 1;">
                        <label>وقت البدء:</label>
                        <input type="time" id="start-time">
                    </div>
                    <div style="flex: 1;">
                        <label>وقت الانتهاء:</label>
                        <input type="time" id="end-time">
                    </div>
                </div>
                
                <button class="btn btn-success" onclick="uploadAd()">رفع وجدولة الإعلان ✅</button>
            </div>

            <div class="card">
                <h3>📺 إدارة الإعلانات المرفوعة</h3>
                <div id="ads-list">
                    <p style="text-align: center; color: #555; padding: 20px;">جاري تحميل القائمة...</p>
                </div>
            </div>

            <div class="card">
                <h3>📊 تعديل الإحصائيات (الأرقام الوهمية)</h3>
                <label>إجمالي الزيارات المعروض:</label>
                <input type="number" id="total-views-input" placeholder="مثلاً: 500000">
                <button class="btn btn-gold" onclick="updateStats('total')">تحديث الإجمالي</button>

                <label>عدد المتصلين المعروض:</label>
                <input type="number" id="active-users-input" placeholder="مثلاً: 12000">
                <button class="btn btn-gold" onclick="updateStats('active')">تحديث المتصلين</button>
            </div>

        </div>
    </div>

    <script>
        // دالة تحديث لوحة التحكم بالكامل
        async function refreshDashboard() {
            try {
                const res = await fetch('/api/site-data');
                const data = await res.json();
                
                // تحديث العداد الحقيقي
                document.getElementById('real-users-count').innerText = data.realUsersCount;
                document.getElementById('last-sync').innerText = "تحديث: " + new Date().toLocaleTimeString();

                // تحديث قائمة الإعلانات
                const listDiv = document.getElementById('ads-list');
                if (data.ads && data.ads.length > 0) {
                    listDiv.innerHTML = "";
                    data.ads.forEach(ad => {
                        listDiv.innerHTML += `
                            <div class="ad-item">
                                <img src="${ad.url}">
                                <div class="ad-info">
                                    <p>من: <b>${ad.start}</b> | إلى: <b>${ad.end}</b></p>
                                </div>
                                <button class="btn btn-danger" style="width: auto; margin:0; padding: 5px 12px;" onclick="deleteAd(${ad.id})">حذف</button>
                            </div>
                        `;
                    });
                } else {
                    listDiv.innerHTML = `<p style="text-align: center; color: #555; padding: 20px;">لا توجد إعلانات مجدولة حالياً</p>`;
                }
            } catch (error) {
                console.error("خطأ في الاتصال بالسيرفر");
            }
        }

        // دالة رفع الإعلان مع المزامنة
        async function uploadAd() {
            const file = document.getElementById('ad-file').files[0];
            const start = document.getElementById('start-time').value;
            const end = document.getElementById('end-time').value;

            if(!file || !start || !end) {
                return alert("يرجى اختيار الصورة وتحديد وقت البداية والنهاية!");
            }

            const formData = new FormData();
            formData.append('adImage', file);
            formData.append('startTime', start);
            formData.append('endTime', end);

            try {
                const res = await fetch('/api/upload-ad', { method: 'POST', body: formData });
                const result = await res.json();
                if(result.success) {
                    alert("تم رفع الإعلان وجدولته بنجاح!");
                    refreshDashboard();
                }
            } catch (e) {
                alert("حدث خطأ أثناء الرفع");
            }
        }

        // دالة حذف إعلان معين
        async function deleteAd(id) {
            if(!confirm("هل أنت متأكد من حذف هذا الإعلان؟")) return;
            
            try {
                const res = await fetch('/api/delete-ad', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ id })
                });
                const result = await res.json();
                if(result.success) refreshDashboard();
            } catch (e) {
                alert("خطأ في الحذف");
            }
        }

        // تحديث الأرقام الوهمية
        async function updateStats(type) {
            const inputId = (type === 'total') ? 'total-views-input' : 'active-users-input';
            const val = document.getElementById(inputId).value;
            
            if(!val) return alert("أدخل الرقم المطلوب أولاً");

            try {
                const res = await fetch('/api/update-manual-stats', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ type, value: val })
                });
                const result = await res.json();
                if(result.success) alert("تم تحديث الإحصائيات المعروضة بنجاح!");
            } catch (e) {
                alert("خطأ في التحديث");
            }
        }

        // تشغيل التحديث التلقائي كل 3 ثوانٍ لمراقبة الزوار الحقيقيين
        setInterval(refreshDashboard, 3000);
        window.onload = refreshDashboard;
    </script>
</body>
</html>
