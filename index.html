
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Face Role AI | النسخة الاحترافية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>

    <style>
        :root {
            --accent: #ffd700;
            --bg: #0b0c10;
            --panel: #1f2833;
            --purple: #6f42c1;
            --text-white: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg);
            color: var(--text-white);
            padding-top: 140px; /* مساحة للإعلان الثابت */
            min-height: 100vh;
        }

        /* الإعلان الثابت في الأعلى - مساحة كبيرة */
        #ad-top-layer {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 120px;
            background: #000;
            z-index: 1000;
            border-bottom: 3px solid var(--accent);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        #ad-top-layer img { width: 100%; height: 100%; object-fit: cover; }

        .container { max-width: 600px; margin: 0 auto; padding: 20px; text-align: center; }

        h1 { font-weight: 900; font-size: 2.5rem; cursor: pointer; margin-bottom: 10px; }

        /* شريط الإحصائيات الذكي */
        .stats-container {
            display: flex; gap: 15px; margin-bottom: 30px;
            background: rgba(255,255,255,0.05); padding: 15px; border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .stat-card { flex: 1; }
        .stat-card p { font-size: 0.8rem; color: #aaa; }
        .stat-card span { display: block; font-size: 1.4rem; color: var(--accent); font-weight: bold; }

        /* منطقة الرفع والتحليل */
        .upload-zone {
            width: 100%; height: 280px; border: 2px dashed rgba(255,215,0,0.3);
            border-radius: 25px; background: rgba(255,255,255,0.02);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            position: relative; overflow: hidden; transition: 0.3s;
        }
        #preview-img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .file-input { position: absolute; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 10; }

        .btn-main {
            width: 100%; padding: 20px; border: none; border-radius: 50px;
            font-size: 1.2rem; font-weight: 700; cursor: pointer;
            background: linear-gradient(90deg, var(--purple), #8a2be2);
            color: white; margin-top: 25px; display: none;
            box-shadow: 0 10px 20px rgba(111, 66, 193, 0.4);
            transition: 0.3s;
        }
        .btn-main:active { transform: scale(0.98); }

        /* شاشة التحليل */
        #loading-screen { display: none; margin-top: 20px; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid var(--accent); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 10px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* النتيجة */
        #result-screen { display: none; background: var(--panel); padding: 20px; border-radius: 20px; margin-top: 20px; border: 1px solid var(--accent); }
    </style>
</head>
<body>

    <div id="ad-top-layer">
        <img id="current-ad-img" src="https://via.placeholder.com/1200x240?text=ADVERTISING+SPACE" alt="Ad">
    </div>

    <div class="container">
        <h1 id="logo" ondblclick="accessAdmin()">Face Role AI 🎬</h1>
        
        <div class="stats-container">
            <div class="stat-card">
                <p>إجمالي الزيارات</p>
                <span id="total-views">113,000</span>
            </div>
            <div class="stat-card">
                <p>متصل الآن</p>
                <span id="live-users">9,452</span>
            </div>
        </div>

        <div id="main-view">
            <div class="upload-zone" id="drop-zone">
                <input type="file" id="user-photo" class="file-input" accept="image/*">
                <div id="upload-text">
                    <p style="font-size: 3rem;">📸</p>
                    <p>ارفع صورتك لبدء التحليل الذكي</p>
                </div>
                <img id="preview-img">
            </div>
            <button id="analyze-btn" class="btn-main" onclick="processAI()">بدء التحليل الذكي فوراً 🚀</button>
        </div>

        <div id="loading-screen">
            <div class="loader"></div>
            <p>جاري مسح ملامح الوجه وتحليل الشخصية...</p>
        </div>

        <div id="result-screen">
            <h2 id="role-title" style="color: var(--accent);"></h2>
            <p id="role-desc" style="margin-top: 10px; line-height: 1.6;"></p>
            <button onclick="location.reload()" class="btn-main" style="display:block;">تجربة مرة أخرى 🔄</button>
        </div>
    </div>

    <script>
        // إعدادات الأرقام والخوارزمية
        let liveCount = 9452;
        const totalViewsBase = 113000;

        // خوارزمية المتصلين الآن (بين 9000 و 20000)
        function updateLiveUsers() {
            let change = Math.floor(Math.random() * 250) - 100;
            liveCount += change;
            if (liveCount < 9000) liveCount = 9150;
            if (liveCount > 20000) liveCount = 19800;
            document.getElementById('live-users').innerText = liveCount.toLocaleString();
        }

        // تحديث إجمالي الزيارات (زيادة دائمة)
        async function syncSiteData() {
            try {
                const res = await fetch('/api/site-data');
                const data = await res.json();
                // دمج الرقم الأساسي 113 الف مع الزيارات الجديدة من السيرفر
                const finalTotal = totalViewsBase + data.totalViews;
                document.getElementById('total-views').innerText = finalTotal.toLocaleString();
                if(data.currentAd) document.getElementById('current-ad-img').src = data.currentAd;
            } catch(e) { console.log("Offline mode"); }
        }

        // الدخول للإدارة بكلمة سر
        function accessAdmin() {
            const pass = prompt("الرجاء إدخال كلمة السر للدخول للوحة التحكم:");
            if (pass === "SDaderta") {
                window.location.href = "/admin.html";
            } else if (pass !== null) {
                alert("كلمة السر خاطئة! لا يمكنك الدخول.");
            }
        }

        // إصلاح التحليل الذكي
        const fileInput = document.getElementById('user-photo');
        const previewImg = document.getElementById('preview-img');
        const analyzeBtn = document.getElementById('analyze-btn');

        fileInput.onchange = (e) => {
            if (e.target.files && e.target.files[0]) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    previewImg.src = ev.target.result;
                    previewImg.style.display = 'block';
                    document.getElementById('upload-text').style.display = 'none';
                    analyzeBtn.style.display = 'block';
                };
                reader.readAsDataURL(e.target.files[0]);
            }
        };

        async function initAI() {
            const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
            await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
            await faceapi.nets.faceExpressionNet.loadFromUri(MODEL_URL);
        }

        async function processAI() {
            document.getElementById('main-view').style.display = 'none';
            document.getElementById('loading-screen').style.display = 'block';

            // محاكاة التحليل الحقيقي للوجه
            const detections = await faceapi.detectAllFaces(previewImg, new faceapi.TinyFaceDetectorOptions()).withFaceExpressions();
            
            setTimeout(() => {
                document.getElementById('loading-screen').style.display = 'none';
                document.getElementById('result-screen').style.display = 'block';
                
                if (detections.length > 0) {
                    const emotions = detections[0].expressions;
                    const topEmotion = Object.keys(emotions).reduce((a, b) => emotions[a] > emotions[b] ? a : b);
                    showResult(topEmotion);
                } else {
                    showResult('neutral');
                }
            }, 3000);
        }

        function showResult(emotion) {
            const roles = {
                happy: { t: "البطل الكوميدي الأسطوري", d: "ابتسامتك الواثقة تجعلك المرشح الأول لأدوار البطولة في أفلام العيد الضخمة!" },
                sad: { t: "نجم الدراما العميقة", d: "ملامحك تحمل حزناً نبيلاً يجعل المشاهدين يتعاطفون معك في كل لقطة." },
                angry: { t: "قائد العصابة / الشرير", d: "حدة نظراتك وقوة ملامحك تجعلك الخصم الذي يرتجف منه الجميع في أفلام الأكشن." },
                surprised: { t: "المكتشف الغامض", d: "تعابير وجهك مثالية لأدوار المحققين والباحثين عن الأسرار الخفية." },
                neutral: { t: "العميل السري المحترف", d: "هدوؤك الغامض يجعل من المستحيل قراءة أفكارك، أنت جيمس بوند القادم." }
            };
            const res = roles[emotion] || roles.neutral;
            document.getElementById('role-title').innerText = res.t;
            document.getElementById('role-desc').innerText = res.d;
        }

        window.onload = () => {
            initAI();
            syncSiteData();
            setInterval(syncSiteData, 5000);
            setInterval(updateLiveUsers, 2500);
        };
    </script>
</body>
</html>
