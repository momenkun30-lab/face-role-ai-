
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Face Role AI | النسخة الاحترافية المحدثة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>

    <style>
        :root {
            --accent: #ffd700;
            --bg: #0b0c10;
            --purple: #6f42c1;
            --red: #ff4d4d;
            --success: #2ecc71;
            --text: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding-top: 140px;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* نظام الإعلانات المجدولة */
        #ad-top-layer {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 120px;
            background: #000;
            z-index: 1000;
            border-bottom: 3px solid var(--accent);
            display: none;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        #ad-top-layer img {
            width: 100%; height: 100%;
            object-fit: cover;
            transition: opacity 0.8s ease-in-out;
        }

        .container { max-width: 600px; margin: 0 auto; padding: 20px; text-align: center; }

        h1 { font-weight: 900; font-size: 2.2rem; cursor: pointer; margin-bottom: 10px; color: var(--text); }

        .stats-container {
            display: flex; gap: 10px; margin-bottom: 25px;
            background: rgba(255,255,255,0.05); padding: 15px; border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .stat-card { flex: 1; }
        .stat-card p { font-size: 0.8rem; color: #aaa; }
        .stat-card span { display: block; font-size: 1.3rem; color: var(--accent); font-weight: bold; }

        .upload-zone {
            width: 100%; height: 260px; border: 2px dashed rgba(255,215,0,0.3);
            border-radius: 25px; background: rgba(255,255,255,0.02);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            position: relative; overflow: hidden;
        }
        #preview-img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .file-input { position: absolute; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 10; }

        .btn-main {
            width: 100%; padding: 18px; border: none; border-radius: 50px;
            font-size: 1.1rem; font-weight: 700; cursor: pointer;
            background: linear-gradient(90deg, var(--purple), #8a2be2);
            color: white; margin-top: 20px; display: none;
            box-shadow: 0 10px 20px rgba(111, 66, 193, 0.3);
        }

        #result-screen { display: none; margin-top: 20px; text-align: right; }
        .roast-box { 
            background: rgba(255, 77, 77, 0.1); padding: 20px; 
            border-radius: 15px; border-right: 5px solid var(--red); 
        }
        .hero-box { 
            background: #000; padding: 25px; border-radius: 20px; 
            border: 3px solid var(--accent); box-shadow: 0 0 25px var(--accent);
            text-align: center;
        }

        .loader { border: 4px solid #f3f3f3; border-top: 4px solid var(--accent); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="ad-top-layer"><img id="current-ad-img" src=""></div>

    <div class="container">
        <h1 id="logo" ondblclick="accessAdmin()">Face Role AI 🎬</h1>
        
        <div class="stats-container">
            <div class="stat-card"><p>الزيارات</p><span id="total-views">0</span></div>
            <div class="stat-card"><p>المتصلين</p><span id="live-users">0</span></div>
        </div>

        <div id="main-view">
            <div class="upload-zone">
                <input type="file" id="user-photo" class="file-input" accept="image/*">
                <div id="upload-text">
                    <p style="font-size: 2.5rem;">📸</p>
                    <p>ارفع صورتك لنحلل شخصيتك بصراحة</p>
                </div>
                <img id="preview-img">
            </div>
            <p style="font-size:0.75rem; color:#666; margin-top:12px;">🔒 الصور تُعالج في متصفحك فقط ولا يتم حفظها.</p>
            <div id="loading" class="loader"></div>
            <button id="analyze-btn" class="btn-main" onclick="processAI()">بدء التحليل السينمائي 🚀</button>
        </div>

        <div id="result-screen"></div>
    </div>

    <script>
        let allAds = [];

        async function init() {
            const URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
            await faceapi.nets.tinyFaceDetector.loadFromUri(URL);
            await faceapi.nets.faceLandmark68Net.loadFromUri(URL);
            await faceapi.nets.ageGenderNet.loadFromUri(URL);
            sync(); 
            setInterval(sync, 5000);
            setInterval(rotateAds, 10000);
        }

        async function sync() {
            try {
                const res = await fetch('/api/site-data');
                const data = await res.json();
                document.getElementById('total-views').innerText = data.totalViews.toLocaleString();
                document.getElementById('live-users').innerText = data.activeUsers.toLocaleString();
                allAds = data.ads || [];
                rotateAds();
            } catch(e) {}
        }

        function rotateAds() {
            const adLayer = document.getElementById('ad-top-layer');
            const adImg = document.getElementById('current-ad-img');
            const now = new Date();
            const currentTime = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            const activeAds = allAds.filter(ad => currentTime >= ad.start && currentTime <= ad.end);

            if (activeAds.length > 0) {
                adLayer.style.display = 'flex';
                const index = Math.floor(now.getSeconds() / 10) % activeAds.length;
                if (adImg.src !== window.location.origin + activeAds[index].url) {
                    adImg.style.opacity = "0";
                    setTimeout(() => { adImg.src = activeAds[index].url; adImg.style.opacity = "1"; }, 400);
                }
            } else { adLayer.style.display = 'none'; }
        }

        function accessAdmin() { if(prompt("كلمة السر:") === "SDaderta") window.location.href = "/admin.html"; }

        document.getElementById('user-photo').onchange = (e) => {
            const reader = new FileReader();
            reader.onload = (ev) => {
                document.getElementById('preview-img').src = ev.target.result;
                document.getElementById('preview-img').style.display = 'block';
                document.getElementById('upload-text').style.display = 'none';
                document.getElementById('analyze-btn').style.display = 'block';
            };
            reader.readAsDataURL(e.target.files[0]);
        };

        async function processAI() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('analyze-btn').style.display = 'none';
            
            const detections = await faceapi.detectAllFaces(document.getElementById('preview-img'), new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withAgeAndGender();
            
            if (detections.length === 0) {
                alert("لم يتم العثور على وجه!");
                location.reload();
                return;
            }

            const gender = detections[0].gender;
            const luck = Math.random() * 100;
            const isPositive = luck <= 20; // 20% إيجابي

            const negativeData = {
                male: {
                    roles: ["كومبارس صامت", "لص بائس", "سائق غاضب", "موظف بوفيه محبط", "زومبي مشتت"],
                    traits: ["بسبب ملامحك التي توحي بالفشل الدراسي", "لأن وجهك مثالي لأدوار النكد", "بسبب نظرة عينك التي تشبه شخصاً ضاعت محفظته"]
                },
                female: {
                    roles: ["بطلة مسلسل نكد", "جارة تراقب الجميع", "خاطبة فاشلة", "مدربة طبخ تحرق الطعام"],
                    traits: ["لأن ملامحكِ تعطي انطباعاً بوجود خطة شريرة", "بسبب ابتسامتكِ التي تشبه طلب استغاثة", "بسبب نظراتكِ التي تثير القلق"]
                }
            };

            const positiveData = {
                male: { roles: ["البطل الأسطوري", "نجم الأكشن القادم"], traits: ["كاريزما عالمية وملامح نجوم"] },
                female: { roles: ["الملكة الأسطورية", "نجمة السجادة الحمراء"], traits: ["جمال ملكي ووجه يشرق أمام الكاميرا"] }
            };

            const list = isPositive ? positiveData[gender] : negativeData[gender];
            const rRole = list.roles[Math.floor(Math.random() * list.roles.length)];
            const rTrait = list.traits[Math.floor(Math.random() * list.traits.length)];

            setTimeout(() => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('main-view').style.display = 'none';
                const resDiv = document.getElementById('result-screen');
                resDiv.style.display = 'block';

                if (isPositive) {
                    resDiv.innerHTML = `
                        <div class="hero-box">
                            <h1 style="color:var(--accent)">🌟 ${rRole} 🌟</h1>
                            <p style="margin:15px 0;">لقد كنت من المحظوظين الـ 20%! ${rTrait}</p>
                            <button onclick="location.reload()" class="btn-main" style="display:block; background:var(--accent); color:#000;">أعد المحاولة مرة أخرى 🔄</button>
                        </div>`;
                } else {
                    resDiv.innerHTML = `
                        <h2 style="color:var(--red); font-weight:900;">🎭 دورك: ${rRole}</h2>
                        <div class="roast-box" style="margin-top:15px;">
                            <p style="color:var(--red); font-weight:bold; margin-bottom:5px;">لماذا تم اختيارك؟ (التقييم: سلبي 80%)</p>
                            <p>${rTrait}</p>
                        </div>
                        <button onclick="location.reload()" class="btn-main" style="display:block; background:var(--red);">أعد المحاولة مرة أخرى 🔄</button>
                    `;
                }
            }, 1500);
        }
        window.onload = init;
    </script>
</body>
</html>
