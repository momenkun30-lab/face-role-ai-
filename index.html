<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Role AI | الإدارة الاحترافية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
    <style>
        :root { --accent: #ffd700; --bg: #0b0c10; --panel: #1f2833; --purple: #6f42c1; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: white; margin: 0; padding-top: 140px; }

        /* منطقة الإعلانات الثابتة في الأعلى */
        #ad-top-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 120px;
            background: #000; z-index: 1000; border-bottom: 3px solid var(--accent);
            display: flex; justify-content: center; align-items: center; overflow: hidden;
        }
        #ad-top-layer img { width: 100%; height: 100%; object-fit: cover; }

        .container { max-width: 600px; margin: 0 auto; padding: 20px; text-align: center; }
        
        /* شريط الإحصائيات */
        .stats-container {
            display: flex; gap: 15px; margin-bottom: 30px;
            background: rgba(255,255,255,0.05); padding: 15px; border-radius: 12px;
        }
        .stat-card { flex: 1; text-align: center; }
        .stat-card span { display: block; font-size: 1.2rem; color: var(--accent); font-weight: bold; }

        /* منطقة الرفع */
        .upload-zone {
            width: 100%; height: 250px; border: 2px dashed rgba(255,215,0,0.3);
            border-radius: 20px; background: rgba(255,255,255,0.02);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            position: relative; cursor: pointer;
        }
        #preview-img { width: 100%; height: 100%; object-fit: cover; border-radius: 18px; display: none; }
        .file-input { position: absolute; width: 100%; height: 100%; opacity: 0; cursor: pointer; }

        .btn-main {
            width: 100%; padding: 18px; border: none; border-radius: 50px;
            font-size: 1.1rem; font-weight: 700; cursor: pointer;
            background: linear-gradient(90deg, var(--purple), #8a2be2);
            color: white; margin-top: 20px; display: none;
        }

        /* لوحة التحكم */
        .admin-panel {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: var(--panel); padding: 30px; border-radius: 20px;
            z-index: 2000; display: none; border: 2px solid var(--accent); width: 320px;
        }
        .btn-save { background: var(--accent); color: black; border: none; padding: 12px; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="ad-top-layer">
        <img id="current-ad-img" src="https://via.placeholder.com/1200x200?text=AD+SPACE" alt="Ad">
    </div>

    <div class="container">
        <h1 id="logo" style="cursor:pointer; font-weight: 900;">Face Role AI 🎬</h1>
        
        <div class="stats-container">
            <div class="stat-card">إجمالي الزيارات <span id="total-views">0</span></div>
            <div class="stat-card">متصل الآن <span id="live-users">1</span></div>
        </div>

        <div id="view-upload">
            <div class="upload-zone">
                <input type="file" id="user-photo" class="file-input" accept="image/*">
                <div id="upload-prompt">📸 ارفع صورتك للتحليل</div>
                <img id="preview-img">
            </div>
            <button id="analyze-btn" class="btn-main">بدء التحليل الذكي 🚀</button>
        </div>
    </div>

    <div id="admin-box" class="admin-panel">
        <h3>إدارة الإعلانات ⚙️</h3>
        <p style="font-size: 0.8rem;">اختر صورة الإعلان الجديد:</p>
        <input type="file" id="ad-file-input" accept="image/*">
        <button class="btn-save" onclick="uploadAd()">تحديث الإعلان فوراً</button>
        <button onclick="document.getElementById('admin-box').style.display='none'" style="background:none; color:white; border:none; margin-top:10px; cursor:pointer;">إغلاق</button>
    </div>

    <script>
        const fileInput = document.getElementById('user-photo');
        const previewImg = document.getElementById('preview-img');
        const analyzeBtn = document.getElementById('analyze-btn');

        // تحميل الذكاء الاصطناعي
        async function initAI() {
            const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
            await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
            await faceapi.nets.faceExpressionNet.loadFromUri(MODEL_URL);
        }

        // تحديث الإحصائيات والإعلان
        async function syncData() {
            const res = await fetch('/api/site-data');
            const data = await res.json();
            document.getElementById('total-views').innerText = data.totalViews;
            document.getElementById('live-users').innerText = data.liveNow;
            if(data.currentAd) document.getElementById('current-ad-img').src = data.currentAd;
        }

        // رفع الإعلان من لوحة التحكم
        async function uploadAd() {
            const adFile = document.getElementById('ad-file-input').files[0];
            if(!adFile) return alert("اختر صورة أولاً");
            const fd = new FormData();
            fd.append('adImage', adFile);
            await fetch('/api/upload-ad', { method: 'POST', body: fd });
            alert("تم التحديث!");
            location.reload();
        }

        fileInput.onchange = (e) => {
            const reader = new FileReader();
            reader.onload = (ev) => {
                previewImg.src = ev.target.result;
                previewImg.style.display = 'block';
                document.getElementById('upload-prompt').style.display = 'none';
                analyzeBtn.style.display = 'block';
            };
            reader.readAsDataURL(e.target.files[0]);
        };

        document.getElementById('logo').ondblclick = () => {
            document.getElementById('admin-box').style.display = 'block';
        };

        window.onload = () => { initAI(); syncData(); setInterval(syncData, 5000); };
    </script>
</body>
</html>
