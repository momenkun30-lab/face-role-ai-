
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Role AI | النسخة النهائية المحدثة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
    <style>
        :root { --accent: #ffd700; --bg: #0b0c10; --purple: #6f42c1; --red: #ff4d4d; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: white; margin: 0; padding-top: 140px; }
        
        #ad-top-layer { position: fixed; top: 0; left: 0; width: 100%; height: 120px; background: #000; z-index: 1000; border-bottom: 3px solid var(--accent); display: flex; justify-content: center; align-items: center; }
        #ad-top-layer img { width: 100%; height: 100%; object-fit: cover; }

        .container { max-width: 600px; margin: 0 auto; padding: 20px; text-align: center; }
        .stats-container { display: flex; gap: 15px; margin-bottom: 30px; background: rgba(255,255,255,0.05); padding: 15px; border-radius: 12px; }
        .stat-card span { display: block; font-size: 1.4rem; color: var(--accent); font-weight: bold; }

        .upload-zone { width: 100%; height: 280px; border: 2px dashed rgba(255,215,0,0.3); border-radius: 25px; position: relative; display: flex; justify-content: center; align-items: center; overflow: hidden; background: rgba(255,255,255,0.02); }
        #preview-img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .file-input { position: absolute; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 10; }

        .btn-main { width: 100%; padding: 20px; border: none; border-radius: 50px; font-size: 1.2rem; font-weight: 700; cursor: pointer; color: white; margin-top: 20px; display: none; }
        
        #result-screen { display: none; margin-top: 20px; text-align: right; }
        .roast-box { background: rgba(255, 77, 77, 0.1); padding: 20px; border-radius: 15px; border-right: 5px solid var(--red); }
        .hero-box { border: 3px solid var(--accent); padding: 25px; border-radius: 20px; background: #000; text-align: center; }
    </style>
</head>
<body>

    <div id="ad-top-layer"><img id="current-ad-img" src=""></div>

    <div class="container">
        <h1 id="logo" ondblclick="accessAdmin()" style="cursor:pointer; font-weight:900;">Face Role AI 🎬</h1>
        
        <div class="stats-container">
            <div class="stat-card">إجمالي الزيارات <span id="total-views">0</span></div>
            <div class="stat-card">متصل الآن <span id="live-users">0</span></div>
        </div>

        <div id="main-view">
            <div class="upload-zone">
                <input type="file" id="user-photo" class="file-input" accept="image/*">
                <div id="upload-text">📸 ارفع صورتك (رجل أو امرأة) لنقرر مصيرك</div>
                <img id="preview-img">
            </div>
            <p style="font-size:0.7rem; color:#666; margin-top:10px;">🔒 خصوصيتك محفوظة: المعالجة تتم داخل جهازك فقط.</p>
            <button id="analyze-btn" class="btn-main" style="background:var(--purple);" onclick="processAI()">بدء التحليل الذكي 🚀</button>
        </div>

        <div id="result-screen"></div>
    </div>

    <script>
        async function init() {
            const URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
            await faceapi.nets.tinyFaceDetector.loadFromUri(URL);
            await faceapi.nets.faceExpressionNet.loadFromUri(URL);
            await faceapi.nets.faceLandmark68Net.loadFromUri(URL);
            await faceapi.nets.ageGenderNet.loadFromUri(URL);
            sync(); setInterval(sync, 5000);
        }

        async function sync() {
            const res = await fetch('/api/site-data');
            const data = await res.json();
            document.getElementById('total-views').innerText = data.totalViews.toLocaleString();
            document.getElementById('live-users').innerText = data.activeUsers.toLocaleString();
            if(data.currentAd) document.getElementById('current-ad-img').src = data.currentAd;
        }

        function accessAdmin() { if(prompt("كلمة السر:") === "SDaderta") window.location.href = "/admin.html"; }

        document.getElementById('user-photo').onchange = (e) => {
            const reader = new FileReader();
            reader.onload = (ev) => {
                document.getElementById('preview-img').src = ev.target.result;
                document.getElementById('preview-img').style.display = 'block';
                document.getElementById('upload-text').style.display = 'none';
                document.getElementById('analyze-btn').style.display = 'block';
            };
            reader.readAsDataURL(e.target.files[0]);
        };

        async function processAI() {
            document.getElementById('analyze-btn').innerText = "جاري كشف الهوية...";
            const detections = await faceapi.detectAllFaces(document.getElementById('preview-img'), new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withAgeAndGender();
            
            if (detections.length === 0) return alert("لم يتم العثور على وجه!");

            let count = parseInt(localStorage.getItem('attempts') || 0) + 1;
            localStorage.setItem('attempts', count);

            const gender = detections[0].gender;
            const resDiv = document.getElementById('result-screen');
            document.getElementById('main-view').style.display = 'none';
            resDiv.style.display = 'block';

            if (count % 100 === 0) {
                const title = (gender === 'male') ? "البطل الأسطوري" : "الملكة الأسطورية";
                resDiv.innerHTML = `<div class="hero-box">
                    <h1 style="color:var(--accent)">🌟 ${title} 🌟</h1>
                    <p>المحاولة رقم ${count}: ملامحك نادرة جداً، أنت النجم الحقيقي اليوم!</p>
                    <button onclick="location.reload()" class="btn-main" style="display:block; background:var(--accent); color:#000;">أعد المحاولة مرة أخرى 🔄</button>
                </div>`;
            } else {
                const roasts = {
                    male: {
                        roles: ["لص بائس", "كومبارس صامت", "سائق غاضب", "موظف بوفيه محبط"],
                        reasons: ["ملامحك توحي بأنك تدفع الأبواب المكتوب عليها اسحب.", "وجهك يبدو كخطأ برمجى في نظام البشر."]
                    },
                    female: {
                        roles: ["خاطبة فاشلة", "بطلة مسلسل نكد", "جارة تراقب الجميع", "مدربة طبخ تحرق الطعام"],
                        reasons: ["نظراتكِ توحي بأنكِ تجهزين خطة لعمل بلوك للجميع.", "ملامحكِ مثالية لدور شخص يغضب بدون سبب."]
                    }
                };
                const list = roasts[gender] || roasts.male;
                const rRole = list.roles[Math.floor(Math.random()*list.roles.length)];
                const rReason = list.reasons[Math.floor(Math.random()*list.reasons.length)];
                
                resDiv.innerHTML = `
                    <h2 style="color:var(--red)">🎭 دورك: ${rRole}</h2>
                    <div class="roast-box">
                        <p style="color:var(--red); font-weight:bold;">لماذا وقع الاختيار؟ (الجنس: ${gender === 'male' ? 'ذكر' : 'أنثى'})</p>
                        <p>${rReason}</p>
                    </div>
                    <p style="font-size:0.8rem; color:#555; margin-top:10px;">المحاولة: ${count} (البطل في 100)</p>
                    <button onclick="location.reload()" class="btn-main" style="display:block; background:var(--red);">أعد المحاولة مرة أخرى 🔄</button>
                `;
            }
        }
        window.onload = init;
    </script>
</body>
</html>
