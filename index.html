
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Face Role AI | النظام الاحترافي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
    <style>
        :root { --accent: #ffd700; --bg: #0b0c10; --panel: #1f2833; --purple: #6f42c1; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: white; margin: 0; padding-top: 140px; overflow-x: hidden; }

        /* منطقة الإعلانات المتحركة */
        #ad-top-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 120px;
            background: #000; z-index: 1000; border-bottom: 3px solid var(--accent);
            display: flex; justify-content: center; align-items: center; overflow: hidden;
        }
        #ad-top-layer img { 
            width: 100%; height: 100%; object-fit: cover; 
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.5s; 
        }
        .ad-slide-in { animation: slideIn 0.8s forwards; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        .container { max-width: 600px; margin: 0 auto; padding: 20px; text-align: center; }
        .stats-container { display: flex; gap: 15px; margin-bottom: 30px; background: rgba(255,255,255,0.05); padding: 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); }
        .stat-card { flex: 1; }
        .stat-card span { display: block; font-size: 1.4rem; color: var(--accent); font-weight: bold; }

        .upload-zone {
            width: 100%; height: 280px; border: 2px dashed rgba(255,215,0,0.3);
            border-radius: 25px; background: rgba(255,255,255,0.02);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            position: relative; overflow: hidden;
        }
        #preview-img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .file-input { position: absolute; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 10; }

        /* رسالة الخصوصية */
        .privacy-note { font-size: 0.75rem; color: #888; margin-top: 12px; display: flex; align-items: center; justify-content: center; gap: 5px; }

        .btn-main {
            width: 100%; padding: 20px; border: none; border-radius: 50px;
            font-size: 1.2rem; font-weight: 700; cursor: pointer;
            background: linear-gradient(90deg, var(--purple), #8a2be2);
            color: white; margin-top: 25px; display: none;
            box-shadow: 0 10px 20px rgba(111, 66, 193, 0.4);
        }

        #result-screen { display: none; background: var(--panel); padding: 25px; border-radius: 20px; margin-top: 20px; border: 1px solid var(--accent); text-align: right; }
        .analysis-box { margin-top: 15px; padding: 10px; border-radius: 10px; background: rgba(0,0,0,0.2); }
        .tag-pos { color: #2ecc71; font-weight: bold; }
        .tag-neg { color: #e74c3c; font-weight: bold; }
    </style>
</head>
<body>

    <div id="ad-top-layer">
        <img id="current-ad-img" src="" class="ad-slide-in">
    </div>

    <div class="container">
        <h1 id="logo" style="cursor:pointer; font-weight: 900;" ondblclick="accessAdmin()">Face Role AI 🎬</h1>
        
        <div class="stats-container">
            <div class="stat-card"><p>إجمالي الزيارات</p><span id="total-views">0</span></div>
            <div class="stat-card"><p>متصل الآن</p><span id="live-users">0</span></div>
        </div>

        <div id="main-view">
            <div class="upload-zone">
                <input type="file" id="user-photo" class="file-input" accept="image/*">
                <div id="upload-text">📸 ارفع صورتك لبدء التحليل</div>
                <img id="preview-img">
            </div>
            <div class="privacy-note">
                <span>🔒</span> نلتزم بخصوصيتك: الصورة تُعالج في متصفحك فقط ولا يتم حفظها نهائياً.
            </div>
            <button id="analyze-btn" class="btn-main" onclick="processAI()">بدء التحليل الذكي 🚀</button>
        </div>

        <div id="result-screen">
            <h2 id="role-title" style="color: var(--accent); text-align: center;"></h2>
            <div class="analysis-box">
                <p><span class="tag-pos">● التقييم الإيجابي:</span> <span id="pos-desc"></span></p>
            </div>
            <div class="analysis-box">
                <p><span class="tag-neg">● النقد البناء:</span> <span id="neg-desc"></span></p>
            </div>
            <button onclick="location.reload()" class="btn-main" style="display:block;">تحليل صورة أخرى 🔄</button>
        </div>
    </div>

    <script>
        let adQueue = [];
        let currentAdIndex = 0;

        // نظام تبديل الإعلانات الذكي
        async function syncData() {
            const res = await fetch('/api/site-data');
            const data = await res.json();
            
            document.getElementById('total-views').innerText = data.totalViews.toLocaleString();
            document.getElementById('live-users').innerText = data.activeUsers.toLocaleString();
            
            // تحديث قائمة الإعلانات (إذا وجد إعلان حالي وقادم)
            if (data.currentAd) {
                const adImg = document.getElementById('current-ad-img');
                if (adImg.src !== window.location.origin + data.currentAd) {
                    adImg.style.opacity = '0';
                    setTimeout(() => {
                        adImg.src = data.currentAd;
                        adImg.style.opacity = '1';
                        adImg.classList.remove('ad-slide-in');
                        void adImg.offsetWidth; // Trigger reflow
                        adImg.classList.add('ad-slide-in');
                    }, 500);
                }
            }
        }

        function accessAdmin() {
            const pass = prompt("كلمة السر للإدارة:");
            if (pass === "SDaderta") window.location.href = "/admin.html";
        }

        const fileInput = document.getElementById('user-photo');
        fileInput.onchange = (e) => {
            const reader = new FileReader();
            reader.onload = (ev) => {
                document.getElementById('preview-img').src = ev.target.result;
                document.getElementById('preview-img').style.display = 'block';
                document.getElementById('upload-text').style.display = 'none';
                document.getElementById('analyze-btn').style.display = 'block';
            };
            reader.readAsDataURL(e.target.files[0]);
        };

        async function processAI() {
            document.getElementById('analyze-btn').innerText = "جاري التحليل...";
            const detections = await faceapi.detectAllFaces(document.getElementById('preview-img'), new faceapi.TinyFaceDetectorOptions()).withFaceExpressions();
            
            setTimeout(() => {
                document.getElementById('main-view').style.display = 'none';
                document.getElementById('result-screen').style.display = 'block';
                showResult(detections.length > 0 ? Object.keys(detections[0].expressions).reduce((a, b) => detections[0].expressions[a] > detections[0].expressions[b] ? a : b) : 'neutral');
            }, 2000);
        }

        function showResult(emotion) {
            const roles = {
                happy: { t: "البطل الكوميدي الأسطوري", p: "تملك كاريزما مبهجة تجعل الجمهور يبتسم فور رؤيتك، طاقتك الإيجابية هي سر نجاحك.", n: "قد تبالغ في المزاح مما يجعل البعض يواجه صعوبة في أخذ قراراتك الجدية على محمل الثقة." },
                sad: { t: "نجم الدراما العميقة", p: "إحساسك العالي يجعلك تتقن الأدوار التي تلمس القلوب، ملامحك تنطق قبل لسانك.", n: "تميل للانعزال وتغليب العاطفة، مما قد يجعلك تبدو ضعيفاً في مواقف تتطلب الحزم." },
                angry: { t: "قائد الأكشن / الشرير الداهية", p: "حضورك قوي جداً، ملامحك تعطي انطباعاً بالهيبة والسيطرة المطلقة.", n: "حدة تعاملك قد تخلق حواجز بينك وبين فريق عملك، حاول إظهار الجانب اللين أحياناً." },
                neutral: { t: "العميل السري الغامض", p: "ثباتك الانفعالي مذهل، لا يمكن لأحد اختراق أفكارك، أنت الشخص المناسب للمهمات الصعبة.", n: "برودك الزائد قد يفسره البعض على أنه عدم اهتمام، مما قد يؤثر على علاقاتك الاجتماعية." }
            };
            const res = roles[emotion] || roles.neutral;
            document.getElementById('role-title').innerText = res.t;
            document.getElementById('pos-desc').innerText = res.p;
            document.getElementById('neg-desc').innerText = res.n;
        }

        async function init() {
            await faceapi.nets.tinyFaceDetector.loadFromUri('https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/');
            await faceapi.nets.faceExpressionNet.loadFromUri('https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/');
            syncData();
            setInterval(syncData, 5000);
        }
        window.onload = init;
    </script>
</body>
</html>
