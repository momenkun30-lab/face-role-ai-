<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الإدارة المركزي | Face Role AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #ffd700;
            --bg: #0b0c10;
            --card: #1f2833;
            --danger: #ff4d4d;
            --success: #2ecc71;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Cairo', sans-serif;
            display: flex;
            min-height: 100vh;
        }

        /* القائمة الجانبية */
        .sidebar {
            width: 280px;
            background: #000;
            padding: 30px 20px;
            border-left: 2px solid var(--gold);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .sidebar h2 { color: var(--gold); text-align: center; font-weight: 900; margin-bottom: 20px; }

        /* المحتوى الرئيسي */
        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        .section-title {
            font-size: 1.8rem;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--card);
            padding-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 25px;
        }

        .card {
            background: var(--card);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid rgba(255, 215, 0, 0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .card h3 { margin-bottom: 20px; color: var(--gold); display: flex; align-items: center; gap: 10px; }

        /* العناصر التفاعلية */
        label { display: block; margin-bottom: 8px; font-size: 0.9rem; color: #ccc; }
        input {
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            background: #0b0c10;
            border: 1px solid #333;
            border-radius: 10px;
            color: white;
            font-size: 1rem;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            font-size: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-gold { background: var(--gold); color: black; }
        .btn-gold:hover { background: #e6c200; }

        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }

        .btn-outline { background: transparent; border: 1px solid #444; color: white; margin-top: auto; }

        .status-badge {
            background: rgba(46, 204, 113, 0.1);
            color: var(--success);
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>إدارة النظام ⚙️</h2>
        <div class="status-badge">● السيرفر متصل (Live)</div>
        <p style="font-size: 0.8rem; color: #666;">مرحباً بك في لوحة التحكم المركزية لـ Face Role AI</p>
        
        <button class="btn btn-outline" onclick="window.location.href='/'">🏠 معاينة الموقع</button>
    </div>

    <div class="main-content">
        <h1 class="section-title">لوحة التحكم الكاملة</h1>

        <div class="grid">
            <div class="card">
                <h3>📺 إدارة الإعلانات والجدولة</h3>
                
                <label>رفع إعلان جديد (سيتم استبدال الحالي):</label>
                <input type="file" id="ad-file" accept="image/*">
                <button class="btn btn-success" onclick="uploadAd()">🚀 نشر الإعلان فوراً</button>
                
                <hr style="margin: 20px 0; border-color: #333;">
                
                <label>جدولة اختفاء الإعلان (بالدقائق):</label>
                <input type="number" id="ad-timer" placeholder="مثال: 60 (ليختفي بعد ساعة)">
                <button class="btn btn-gold" onclick="setTimer()">⏱️ ضبط المؤقت</button>
                
                <button class="btn btn-danger" style="margin-top: 15px;" onclick="deleteAd()">🗑️ حذف الإعلان الحالي نهائياً</button>
            </div>

            <div class="card">
                <h3>📊 التحكم في الإحصائيات (وهمي/حقيقي)</h3>
                
                <label>تحديد إجمالي عدد الزيارات (الرقم الظاهر):</label>
                <input type="number" id="total-views-input" placeholder="مثال: 113000">
                <button class="btn btn-gold" onclick="updateManualStats('total')">تثبيت إجمالي الزيارات</button>

                <hr style="margin: 20px 0; border-color: #333;">

                <label>تحديد عدد المتصلين الآن (نشط):</label>
                <input type="number" id="active-users-input" placeholder="مثال: 9000">
                <button class="btn btn-gold" onclick="updateManualStats('active')">تثبيت العدد النشط</button>

                <p style="margin-top: 15px; font-size: 0.8rem; color: #888;">* ملاحظة: الأرقام ستظهر للمستخدمين وتزيد تلقائياً بشكل طفيف لزيادة المصداقية.</p>
            </div>
        </div>
    </div>

    <script>
        // 1. رفع الإعلان
        async function uploadAd() {
            const fileInput = document.getElementById('ad-file');
            if (fileInput.files.length === 0) return alert("يرجى اختيار ملف صورة أولاً");

            const formData = new FormData();
            formData.append('adImage', fileInput.files[0]);

            const res = await fetch('/api/upload-ad', {
                method: 'POST',
                body: formData
            });
            const data = await res.json();
            if (data.success) alert("تم رفع ونشر الإعلان بنجاح!");
        }

        // 2. حذف الإعلان
        async function deleteAd() {
            if (!confirm("هل أنت متأكد من حذف الإعلان؟")) return;
            const res = await fetch('/api/delete-ad', { method: 'POST' });
            const data = await res.json();
            if (data.success) alert("تم حذف الإعلان من الموقع.");
        }

        // 3. تحديث الإحصائيات
        async function updateManualStats(type) {
            const inputId = type === 'total' ? 'total-views-input' : 'active-users-input';
            const value = document.getElementById(inputId).value;
            
            if (!value) return alert("يرجى إدخال رقم");

            const res = await fetch('/api/update-manual-stats', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ type, value })
            });
            const data = await res.json();
            if (data.success) alert("تم تحديث البيانات بنجاح!");
        }

        // 4. ضبط المؤقت
        async function setTimer() {
            const minutes = document.getElementById('ad-timer').value;
            if (!minutes) return alert("يرجى إدخال عدد الدقائق");

            const res = await fetch('/api/set-timer', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ minutes })
            });
            const data = await res.json();
            if (data.success) alert(`سيختفي الإعلان تلقائياً في تمام الساعة: ${data.switchAt}`);
        }
    </script>
</body>
</html>
